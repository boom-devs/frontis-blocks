name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in Frontis Blocks"
title: "bug: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue to **Frontis Blocks**! Please provide as much detail as possible to help us reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "When inserting the Container block on mobile..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the behavior."
      placeholder: |
        1. Insert 'Advanced Button' block.
        2. Set gradient background.
        3. View frontend...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: dropdown
    id: affected_block
    attributes:
      label: "Affected Block or Component"
      options:
        - "Advanced Button"
        - "Advanced Heading"
        - "Advanced Image"
        - "Call To Action"
        - "Container"
        - "Counter"
        - "Coverflow Carousel"
        - "Dual Button"
        - "Flip Box"
        - "Grid Layout"
        - "Icon Box"
        - "Image Accordion"
        - "Image Comparison"
        - "Image Hotspot"
        - "Info Box"
        - "Lightbox Modal"
        - "Loop Builder"
        - "Mega Menu"
        - "Multi-Column Pricing Table"
        - "Off-Canvas Menu"
        - "Post Grid / Carousel"
        - "Rive Animation"
        - "Stack Card"
        - "Tabs"
        - "Team Member"
        - "Testimonial"
        - "Vertical Timeline"
        - "Template Library"
        - "Global Settings / Sidebar"
        - "Core Plugin / General"
    validations:
      required: true

  - type: input
    id: wp_version
    attributes:
      label: "WordPress Version"
      placeholder: "e.g. 6.7"
    validations:
      required: false

  - type: input
    id: php_version
    attributes:
      label: "PHP Version"
      placeholder: "e.g. 8.2"
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: "Browser & OS"
      placeholder: "e.g. Chrome 130 on macOS / Windows"
    validations:
      required: false
