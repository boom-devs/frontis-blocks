name: "💡 Feature Request"
description: "Suggest an idea or enhancement for Frontis Blocks"
title: "feat: "
labels: ["type: enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make **Frontis Blocks** even better? Tell us what you'd love to see!

  - type: textarea
    id: problem
    attributes:
      label: "Is your feature request related to a problem?"
      description: "A clear and concise description of what the problem is."
      placeholder: "I'm always frustrated when..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: "Describe the Solution You'd Like"
      description: "A clear description of what you want to happen."
      placeholder: "Add support for hover tilt effect in Card blocks..."
    validations:
      required: true

  - type: dropdown
    id: target_area
    attributes:
      label: "Target Area"
      options:
        - "Gutenberg Block Feature"
        - "Design Controls / Sidebar"
        - "Template Library"
        - "Responsive Controls"
        - "Performance / Asset Generation"
        - "Core Plugin Architecture"
    validations:
      required: true
